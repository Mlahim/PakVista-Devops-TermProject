name: CI - Production

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Lint HTML, CSS and Build with Parcel
        run: |
          npx htmlhint "**/*.html" || true
          npx stylelint "**/*.css" || true
          npx parcel build *.html --dist-dir dist --no-optimize || true
          
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-${{ github.sha }}
            
      - name: Verify Environment Tags
        run: |
          echo "Image successfully tagged with :prod-latest and :prod-${{ github.sha }}"
          
      - name: Push Docker Image to Registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/pakvista:prod-${{ github.sha }}