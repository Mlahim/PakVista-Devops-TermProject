# CI Pipeline for Staging Environment
# Triggered on pull requests targeting the staging branch
# Builds and pushes Docker image with staging-specific tags

name: CI - Staging

on:
  pull_request:
    branches:
      - staging

jobs:
  ci-staging:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Lint HTML and CSS files
      - name: Lint HTML with HTMLHint
        run: |
          npm install -g htmlhint
          htmlhint ./*.html

      - name: Lint CSS with Stylelint
        run: |
          npm install -g stylelint stylelint-config-standard
          stylelint style.css --config .stylelintrc.json || true

      # Step 3: Build with Parcel (bundle static assets)
      - name: Build with Parcel
        run: |
          npm install -g parcel
          parcel build ./*.html --dist-dir ./dist --public-url ./

      # Step 4: Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # Step 5: Build Docker Image
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pakvista:staging-latest
            ${{ secrets.DOCKER_USERNAME }}/pakvista:staging-${{ github.sha }}

      # Step 6: Push Docker Image to Docker Hub
      - name: Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pakvista:staging-latest
            ${{ secrets.DOCKER_USERNAME }}/pakvista:staging-${{ github.sha }}